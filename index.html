<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puente Profesional — Tu primer empleo empieza con un primer paso</title>
  <meta name="description" content="Plataforma de demostración y autogestión para estudiantes y recién egresados sin experiencia laboral formal previa." />
  <meta property="og:title" content="Puente Profesional" />
  <meta property="og:description" content="Plataforma de autogestión para el primer empleo. Formación, CV, Portafolio, Entrevistas STAR, Postulaciones y Hábitos." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Estilos visuales minimalistas estilo Notion -->
  <style>
    /* ==========================================================================
       1. VARIABLES CSS Y RESET BASE (ESTILO NOTION)
       ========================================================================== */
    :root {
      --bg-primary: #FFFFFF;
      --bg-secondary: #F7F7F5;
      --bg-tertiary: #EEEEEC;
      --text-primary: #37352F;
      --text-secondary: #686762;
      --text-muted: #8F8E8B;
      --border-subtle: #E8E8E6;
      --border-medium: #D3D3D0;
      
      /* Acentos discretos oficiales Notion */
      --color-inicio: #347EA9;
      --color-formacion: #AAA93E;
      --color-preparacion: #9165B0;
      --color-postulaciones: #E3BD50;
      --color-journal: #C14C8A;
      
      /* Botón principal carbón */
      --btn-primary-bg: #2F2E2B;
      --btn-primary-text: #FFFFFF;
      --btn-primary-hover: #191816;
      
      /* Sombras mínimas y radios tenues */
      --shadow-sm: 0 1px 2px rgba(55, 53, 47, 0.05);
      --shadow-md: 0 4px 12px rgba(55, 53, 47, 0.07);
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      
      --font-stack: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-stack);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, textarea, select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    /* Iconos SVG inline */
    .svg-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* Accesibilidad: foco visible */
    :focus-visible {
      outline: 2px solid var(--text-primary);
      outline-offset: 2px;
    }

    /* ==========================================================================
       2. LAYOUT GENERAL Y CONTENEDORES
       ========================================================================== */
    #app-root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-workspace {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* Sidebar escritorio */
    .app-sidebar {
      width: 256px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      user-select: none;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 16px 16px 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      background-color: var(--text-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: var(--text-primary);
    }

    .sidebar-user {
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
    }

    .sidebar-user-name {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-nav {
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 500;
      transition: background 0.15s ease, color 0.15s ease;
      text-align: left;
      width: 100%;
    }

    .nav-item:hover {
      background-color: rgba(55, 53, 47, 0.04);
      color: var(--text-primary);
    }

    .nav-item.active {
      background-color: rgba(55, 53, 47, 0.08);
      color: var(--text-primary);
      font-weight: 600;
    }

    .nav-icon {
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .btn-exit-demo, .btn-reset-demo {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      font-size: 12.5px;
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      width: 100%;
      text-align: left;
      transition: background 0.15s ease;
    }

    .btn-exit-demo:hover, .btn-reset-demo:hover {
      background-color: rgba(55, 53, 47, 0.05);
      color: var(--text-primary);
    }

    .btn-reset-demo {
      color: #b91c1c;
    }
    .btn-reset-demo:hover {
      background-color: #fee2e2;
      color: #991b1b;
    }

    /* Contenido principal */
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-primary);
      min-width: 0;
      position: relative;
    }

    .top-header {
      height: 52px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background-color: var(--bg-primary);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      color: var(--text-secondary);
    }

    .breadcrumb-current {
      color: var(--text-primary);
      font-weight: 600;
    }

    .mobile-menu-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      color: var(--text-primary);
    }

    .content-viewport {
      flex: 1;
      padding: 32px 36px 64px 36px;
      max-width: 1060px;
      width: 100%;
      margin: 0 auto;
    }

    /* ==========================================================================
       3. COMPONENTES COMUNES Y NOTION-STYLE UI
       ========================================================================== */
    .section-kicker {
      font-size: 12.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.6px;
      color: var(--text-primary);
      margin-bottom: 8px;
      line-height: 1.25;
    }

    .page-description {
      font-size: 14.5px;
      color: var(--text-secondary);
      max-width: 720px;
      margin-bottom: 28px;
    }

    .notion-card {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s ease;
    }

    .notion-card:hover {
      border-color: var(--border-medium);
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .card-meta {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Botones */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 16px;
      font-size: 13.5px;
      font-weight: 500;
      border-radius: var(--radius-sm);
      transition: background 0.15s ease, opacity 0.15s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background-color: var(--btn-primary-bg);
      color: var(--btn-primary-text);
    }

    .btn-primary:hover {
      background-color: var(--btn-primary-hover);
    }

    .btn-secondary {
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
    }

    .btn-secondary:hover {
      background-color: var(--bg-tertiary);
    }

    .btn-danger {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .btn-danger:hover {
      background-color: #fca5a5;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12.5px;
    }

    /* Píldoras e indicadores sutiles (texto oscuro garantizado) */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
    }

    .status-pendiente {
      background-color: #f1f1ef;
      color: #5a5955;
    }

    .status-en-curso {
      background-color: #edf5fa;
      color: #174868;
    }

    .status-completado {
      background-color: #f1f3e7;
      color: #434416; /* Texto oscuro sobre verde lima oliva */
    }

    .status-entrevista {
      background-color: #f5f0f9;
      color: #4a2862;
    }

    .status-oferta {
      background-color: #fdf8e7;
      color: #524212; /* Texto oscuro sobre amarillo dorado */
    }

    .status-rechazada {
      background-color: #fdeeee;
      color: #9c2828;
    }

    .status-retirada {
      background-color: #f3f3f3;
      color: #666666;
    }

    /* Formularios Notion */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .form-label .req {
      color: #b91c1c;
      margin-left: 2px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--text-primary);
      outline: none;
    }

    .form-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* Estado vacío */
    .empty-state {
      padding: 48px 24px;
      text-align: center;
      border: 1px dashed var(--border-medium);
      border-radius: var(--radius-md);
      background-color: var(--bg-secondary);
      margin: 16px 0;
    }

    .empty-state-icon {
      margin-bottom: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: center;
    }

    .empty-state-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .empty-state-desc {
      font-size: 13.5px;
      color: var(--text-secondary);
      max-width: 440px;
      margin: 0 auto 18px auto;
    }

    /* Pestañas */
    .tab-bar {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 24px;
      overflow-x: auto;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-secondary);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: var(--text-primary);
    }

    .tab-btn.active {
      color: var(--text-primary);
      border-bottom-color: var(--text-primary);
      font-weight: 600;
    }

    /* ==========================================================================
       4. SECCIÓN BIENVENIDA Y ACCESO DEMO
       ========================================================================== */
    .welcome-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      max-width: 900px;
      margin: 0 auto;
      padding: 56px 24px;
    }

    .welcome-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 48px;
    }

    .welcome-hero {
      margin-bottom: 48px;
    }

    .welcome-quote-box {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      margin-bottom: 36px;
      font-style: italic;
      color: var(--text-secondary);
      font-size: 14.5px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .welcome-quote-icon {
      font-style: normal;
      color: var(--color-inicio);
      display: flex;
      align-items: center;
    }

    .welcome-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 44px;
    }

    .welcome-feature {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
    }

    .welcome-feature-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
    }

    /* Acceso Demo Modal / Card */
    .access-container {
      max-width: 480px;
      margin: 80px auto;
      padding: 32px;
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
    }

    /* ==========================================================================
       5. DASHBOARD
       ========================================================================== */
    .dashboard-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .metric-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px 20px;
    }

    .metric-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      margin: 6px 0 2px 0;
    }

    .metric-label {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .next-step-card {
      background-color: #faf9f6;
      border: 1px solid #e8e4dc;
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .next-step-content h3 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .next-step-content p {
      font-size: 13.5px;
      color: var(--text-secondary);
    }

    .areas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .area-nav-card {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
      text-align: left;
      transition: border-color 0.15s ease, transform 0.15s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .area-nav-card:hover {
      border-color: var(--text-primary);
      transform: translateY(-1px);
    }

    .area-card-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .journal-prompt-box {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    /* ==========================================================================
       6. ÁREA FORMACIÓN
       ========================================================================== */
    .progress-bar-container {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .progress-track {
      flex: 1;
      height: 8px;
      background-color: var(--border-subtle);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--color-formacion);
      transition: width 0.3s ease;
    }

    .progress-percentage {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      min-width: 50px;
      text-align: right;
    }

    .controls-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
      max-width: 360px;
    }

    .filter-group {
      display: flex;
      gap: 8px;
    }

    .items-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .course-card {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .course-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .course-actions {
      display: flex;
      gap: 6px;
    }

    .auto-save-indicator {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .auto-save-indicator.saved {
      color: #3b7c3f;
    }

    /* ==========================================================================
       7. ÁREA PREPARACIÓN: CV, PORTAFOLIO, ENTREVISTAS
       ========================================================================== */
    .cv-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    .cv-preview-paper {
      background-color: #ffffff;
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-sm);
      padding: 32px 36px;
      box-shadow: var(--shadow-sm);
      font-size: 13.5px;
      line-height: 1.5;
    }

    .cv-preview-header {
      border-bottom: 2px solid var(--text-primary);
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .cv-preview-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .cv-preview-contact {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .cv-preview-section {
      margin-bottom: 18px;
    }

    .cv-preview-section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 4px;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .cv-checklist {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-top: 20px;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    /* Entrevistas STAR */
    .star-guide-banner {
      background-color: #f7f3f9;
      border: 1px solid #ebddef;
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin-bottom: 24px;
      font-size: 13.5px;
    }

    .star-steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 10px;
    }

    .star-step-item {
      background: #ffffff;
      border: 1px solid #e4d3e9;
      border-radius: var(--radius-sm);
      padding: 10px;
      font-size: 12px;
    }

    .star-step-item strong {
      color: var(--color-preparacion);
      display: block;
      margin-bottom: 2px;
    }

    .interview-card {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-top: 16px;
    }

    .interview-suggestion-box {
      background-color: var(--bg-secondary);
      border-left: 3px solid var(--color-preparacion);
      padding: 14px 18px;
      margin: 16px 0;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 13.5px;
    }

    /* ==========================================================================
       8. ÁREA POSTULACIONES
       ========================================================================== */
    .postulaciones-table-container {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow-x: auto;
      background-color: var(--bg-primary);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
    }

    .data-table th {
      background-color: var(--bg-secondary);
      padding: 10px 14px;
      font-weight: 600;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 12.5px;
    }

    .data-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }

    .data-table tr:hover td {
      background-color: rgba(55, 53, 47, 0.02);
    }

    .disclaimer-banner {
      font-size: 12.5px;
      color: var(--text-secondary);
      background-color: #fbf9f2;
      border: 1px solid #f2e9cb;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ==========================================================================
       9. ÁREA JOURNAL Y HÁBITOS
       ========================================================================== */
    .journal-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    .reflection-prompts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .prompt-chip {
      font-size: 12px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      padding: 4px 10px;
      border-radius: 999px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .prompt-chip:hover {
      background-color: var(--border-subtle);
      color: var(--text-primary);
    }

    .habits-container {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-top: 32px;
    }

    .habit-item {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      transition: border-color 0.15s ease;
    }

    .habit-item.done {
      border-color: #cbd5e1;
      background-color: #fafaf9;
    }

    .habit-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--text-primary);
    }

    /* ==========================================================================
       10. MODALES Y TOASTS ACCESIBLES
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(55, 53, 47, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--bg-primary);
      border-radius: var(--radius-md);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-subtle);
      transform: translateY(12px);
      transition: transform 0.2s ease;
    }

    .modal-backdrop.open .modal-card {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .modal-close-btn {
      font-size: 18px;
      color: var(--text-muted);
      padding: 4px;
      line-height: 1;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close-btn:hover {
      color: var(--text-primary);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    /* Toast notification */
    #toast-notification {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background-color: var(--btn-primary-bg);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      box-shadow: var(--shadow-md);
      z-index: 200;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      max-width: 380px;
    }

    #toast-notification.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* ==========================================================================
       11. REGLAS RESPONSIVE (MÓVIL < 768px)
       ========================================================================== */
    @media (max-width: 768px) {
      .app-workspace {
        flex-direction: column;
      }

      .app-sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        z-index: 90;
        width: 270px;
        transition: left 0.25s ease;
        box-shadow: var(--shadow-md);
      }

      .app-sidebar.open {
        left: 0;
      }

      .sidebar-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.3);
        z-index: 80;
      }

      .sidebar-backdrop.open {
        display: block;
      }

      .mobile-menu-btn {
        display: inline-flex;
      }

      .content-viewport {
        padding: 20px 16px 40px 16px;
      }

      .top-header {
        padding: 0 16px;
      }

      .cv-layout, .journal-layout {
        grid-template-columns: 1fr;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .star-steps {
        grid-template-columns: 1fr 1fr;
      }

      /* Transformación de tabla a tarjetas en móvil */
      .data-table, .data-table thead, .data-table tbody, .data-table th, .data-table td, .data-table tr {
        display: block;
      }

      .data-table thead {
        display: none;
      }

      .data-table tr {
        margin-bottom: 12px;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        padding: 12px;
        background: var(--bg-primary);
      }

      .data-table td {
        padding: 6px 0;
        border-bottom: 1px solid #f1f1ef;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .data-table td::before {
        content: attr(data-label);
        font-weight: 600;
        font-size: 12px;
        color: var(--text-secondary);
      }

      .data-table td:last-child {
        border-bottom: none;
      }
    }

    /* Reducción de movimiento */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ==========================================================================
       12. CSS DE IMPRESIÓN (SOLO CURRÍCULUM)
       ========================================================================== */
    @media print {
      body, html {
        background: #ffffff !important;
        color: #000000 !important;
        font-size: 11pt !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      /* Ocultar elementos de interfaz */
      .app-sidebar,
      .top-header,
      .breadcrumb,
      .btn,
      .tab-bar,
      .cv-editor-panel,
      .cv-checklist,
      .controls-bar,
      .no-print,
      .modal-backdrop,
      #toast-notification,
      .page-title,
      .page-description,
      .section-kicker,
      .sidebar-backdrop {
        display: none !important;
      }

      .content-viewport {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .cv-layout {
        display: block !important;
      }

      .cv-preview-paper {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
      }

      @page {
        margin: 1.5cm;
        size: A4 portrait;
      }
    }
  </style>
</head>

    class StorageManager {
      static PREFIX = "puente_demo_";
      static memoryStorage = {};
      static isLocalStorageAvailable = true;

      static init() {
        try {
          const testKey = "__puente_test__";
          localStorage.setItem(testKey, "1");
          localStorage.removeItem(testKey);
          this.isLocalStorageAvailable = true;
        } catch (e) {
          this.isLocalStorageAvailable = false;
          console.warn("localStorage no disponible. Operando en memoria volátil de sesión.");
        }
      }

      static get(key, defaultValue = null) {
        if (!this.isLocalStorageAvailable) {
          return this.memoryStorage[key] !== undefined ? this.memoryStorage[key] : defaultValue;
        }
        try {
          const raw = localStorage.getItem(this.PREFIX + key);
          if (raw === null) return defaultValue;
          return JSON.parse(raw);
        } catch (e) {
          console.error(`Error al leer clave ${key} de localStorage:`, e);
          return defaultValue;
        }
      }

      static set(key, value) {
        if (!this.isLocalStorageAvailable) {
          this.memoryStorage[key] = value;
          return true;
        }
        try {
          localStorage.setItem(this.PREFIX + key, JSON.stringify(value));
          return true;
        } catch (e) {
          console.warn(`Error al guardar en localStorage (posible cuota excedida). Usando memoria.`, e);
          this.memoryStorage[key] = value;
          showToast("Aviso: Espacio de almacenamiento limitado. Se guardará temporalmente en memoria.");
          return false;
        }
      }

      static remove(key) {
        if (!this.isLocalStorageAvailable) {
          delete this.memoryStorage[key];
          return;
        }
        try {
          localStorage.removeItem(this.PREFIX + key);
        } catch (e) {}
      }

      static resetAll() {
        const keysToRemove = [
          "alias", "seeded", "formacion", "cv", "portafolio", 
          "postulaciones", "journal", "habitos", "interview_answers"
        ];
        keysToRemove.forEach(k => {
          this.remove(k);
          delete this.memoryStorage[k];
        });
      }
    }

    StorageManager.init();

    // --- 4. UTILIDADES Y VALIDACIONES ---
    function sanitizeText(str) {
      if (!str) return "";
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function isValidUrl(string) {
      if (!string || string.trim() === "") return true;
      try {
        const url = new URL(string.trim());
        return url.protocol === "http:" || url.protocol === "https:";
      } catch (_) {
        return false;
      }
    }

    function getTodayLocalDateString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatDisplayDate(dateStr) {
      if (!dateStr) return "Sin fecha";
      try {
        const parts = dateStr.split("-");
        if (parts.length === 3) {
          const d = new Date(parts[0], parts[1] - 1, parts[2]);
          return d.toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" });
        }
        return dateStr;
      } catch (e) {
        return dateStr;
      }
    }

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.remove("show");

    }

      // Botón cancelar si existe en contenido

      if (cancelBtn) {
        cancelBtn.onclick = () => closeModal();
      }

      // Manejar confirmación si aplica
      const form = bodyElem.querySelector("form");
      if (form && onConfirm) {
        form.onsubmit = (e) => {
          e.preventDefault();
          onConfirm(form);
        };
      }
    }

    function closeModal() {
      const modal = document.getElementById("app-modal");
      modal.classList.remove("open");
      if (lastActiveElementBeforeModal && typeof lastActiveElementBeforeModal.focus === "function") {
        lastActiveElementBeforeModal.focus();
      }
    }

    // Eventos de teclado para modal (Escape y clic en backdrop)
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        const modal = document.getElementById("app-modal");
        if (modal && modal.classList.contains("open")) {
          closeModal();
        }
      }
    });

    document.getElementById("app-modal").addEventListener("click", (e) => {
      if (e.target.id === "app-modal") {

      }
    });

            ${total === 0 ? '<button class="btn btn-primary" onclick="openAddCourseModal()">Agregar primer curso</button>' : ''}
          </div>
        `;
      } else {
        itemsHtml = `
          <div class="items-grid">

                <div class="course-header">
                  <div>
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                      <span class="status-badge status-${item.estado}">

                      </span>
                      <span style="font-size: 12px; color: var(--text-muted); text-transform: capitalize;">${item.tipo}</span>
                    </div>
                    <h3 style="font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px;">
                      ${sanitizeText(item.titulo)}
                    </h3>
                    <div style="font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                      <span style="color: var(--text-muted);">${Icons.building(14)}</span>
                      <span>${sanitizeText(item.institucion || 'Institución no especificada')}</span>
                      ${item.fechaInicio ? `<span>· Inicio: ${formatDisplayDate(item.fechaInicio)}</span>` : ''}
                      ${item.fechaFin ? `<span>· Fin: ${formatDisplayDate(item.fechaFin)}</span>` : ''}

                  </div>

                  <div class="course-actions">
                    <button class="btn btn-secondary btn-sm" onclick="openEditCourseModal('${item.id}')" title="Editar formación" aria-label="Editar formación">
                      ${Icons.edit(14)}
                    </button>
                    <button class="btn btn-secondary btn-sm" onclick="confirmDeleteCourse('${item.id}')" title="Eliminar formación" aria-label="Eliminar formación">
                      ${Icons.trash(14)}
                    </button>
                  </div>
                </div>

                <!-- Comprobante simulado -->
                <div style="background-color: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 12.5px; display: flex; align-items: center; justify-content: space-between;">
                  <div>
                    <span style="color: var(--text-muted);">Comprobante:</span>
                    <strong>${item.comprobanteNombre ? sanitizeText(item.comprobanteNombre) : 'Sin comprobante adjunto'}</strong>
                  </div>
                  <div>
                    ${item.comprobanteNombre ? `
                      <button class="btn btn-secondary btn-sm" style="padding: 2px 6px; font-size: 11px;" onclick="removeCourseProof('${item.id}')">Quitar comprobante</button>
                    ` : `
                      <label class="btn btn-secondary btn-sm" style="padding: 2px 6px; font-size: 11px; cursor: pointer;">
                        Adjuntar (PDF/Img)
                        <input type="file" accept=".pdf,image/*" style="display: none;" onchange="handleSimulatedProofUpload(event, '${item.id}')" />

                    `}
                  </div>

                <!-- Notas personales con autoguardado -->
                <div>
                  <label class="form-label" style="font-size: 12px; color: var(--text-muted);" for="notes-${item.id}">
                    Notas personales y aprendizajes clave
                  </label>
                  <textarea id="notes-${item.id}" class="form-textarea" style="min-height: 56px; font-size: 13px;" placeholder="¿Qué conceptos clave dominaste en este curso?" oninput="handleAutoSaveCourseNotes('${item.id}', this.value)">${sanitizeText(item.notes || item.notas || '')}</textarea>
                  <div class="auto-save-indicator" id="indicator-${item.id}">
                    <span>Guardado automático al escribir</span>
                  </div>
                </div>
              </div>

          </div>
        `;
      }

      return `
        <div>
          <div class="section-kicker" style="color: var(--color-formacion);">Área 1</div>
          <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 8px;">
            <h1 class="page-title" style="margin-bottom: 0;">Formación y Certificaciones</h1>
            <button class="btn btn-primary" onclick="openAddCourseModal()">
              + Agregar formación
            </button>
          </div>
          <p class="page-description">
            Organiza tus estudios, diplomados y certificaciones. Acompaña cada registro con notas personales para demostrar tu aprendizaje continuo.
          </p>

          <!-- Barra de progreso general -->
          <div class="progress-bar-container">
            <div>
              <div style="font-size: 13px; font-weight: 600; color: var(--text-primary);">Progreso de cursos completados</div>
              <div style="font-size: 12px; color: var(--text-secondary);">${completados} de ${total} registros terminados</div>
            </div>
            <div class="progress-track" aria-label="Progreso general de formación">
              <div class="progress-fill" style="width: ${porcentaje}%;"></div>
            </div>
            <div class="progress-percentage">${porcentaje}%</div>
          </div>

          <!-- Controles de búsqueda y filtros -->
          <div class="controls-bar">
            <div class="search-box">
              <input type="text" class="form-input" placeholder="Buscar por título o institución..." value="${sanitizeText(AppState.filtros.formacionBusqueda)}" oninput="handleFormacionSearch(this.value)" />
            </div>

            <div class="filter-group">
              <select class="form-select" onchange="handleFormacionFilter(this.value)">
                <option value="todos" ${AppState.filtros.formacionEstado === 'todos' ? 'selected' : ''}>Todos los estados</option>
                <option value="en_curso" ${AppState.filtros.formacionEstado === 'en_curso' ? 'selected' : ''}>En curso</option>
                <option value="completado" ${AppState.filtros.formacionEstado === 'completado' ? 'selected' : ''}>Completado</option>
                <option value="pendiente" ${AppState.filtros.formacionEstado === 'pendiente' ? 'selected' : ''}>Pendiente</option>
              </select>
            </div>
          </div>

          <!-- Lista de cursos -->
          ${itemsHtml}
        </div>
      `;
    }

    function handleFormacionSearch(val) {
      AppState.filtros.formacionBusqueda = val;
      renderApp();
    }

    function handleFormacionFilter(val) {
      AppState.filtros.formacionEstado = val;
      renderApp();
    }

    let notesDebounceTimers = {};
    function handleAutoSaveCourseNotes(id, text) {
      const indicator = document.getElementById(`indicator-${id}`);
      if (indicator) {
        indicator.textContent = "Guardando...";
        indicator.classList.remove("saved");
      }

      if (notesDebounceTimers[id]) clearTimeout(notesDebounceTimers[id]);
      notesDebounceTimers[id] = setTimeout(() => {
        const item = AppState.formacion.find(c => c.id === id);
        if (item) {
          item.notas = text;
          saveAllState();
          if (indicator) {
            indicator.textContent = "Guardado ✓";
            indicator.classList.add("saved");
          }
        }
      }, 600);
    }

    function handleSimulatedProofUpload(event, id) {
      const file = event.target.files[0];
      if (!file) return;
      const item = AppState.formacion.find(c => c.id === id);
      if (item) {
        item.comprobanteNombre = file.name;
        saveAllState();
        showToast(`Comprobante "${file.name}" registrado (nota: solo se guarda el nombre con fines demostrativos).`);
        renderApp();
      }
    }

    function removeCourseProof(id) {
      const item = AppState.formacion.find(c => c.id === id);
      if (item) {
        item.comprobanteNombre = "";
        saveAllState();
        showToast("Comprobante retirado.");
        renderApp();
      }
    }

    function openAddCourseModal() {
      openModal(
        "Agregar formación o certificación",
        `
          <form id="form-course">
            <div class="form-group">
              <label class="form-label" for="course-title">Título <span class="req">*</span></label>
              <input type="text" id="course-title" class="form-input" placeholder="Ej. Fundamentos de Gestión de Proyectos" required />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="course-type">Tipo</label>
                <select id="course-type" class="form-select">
                  <option value="curso">Curso</option>
                  <option value="diplomado">Diplomado</option>
                  <option value="certificacion">Certificación</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="course-status">Estado</label>
                <select id="course-status" class="form-select">
                  <option value="en_curso">En curso</option>
                  <option value="completado">Completado</option>
                  <option value="pendiente">Pendiente</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="course-inst">Institución u Organización</label>
              <input type="text" id="course-inst" class="form-input" placeholder="Ej. Universidad Nacional / Coursera / Platzi" />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="course-start">Fecha de inicio</label>
                <input type="date" id="course-start" class="form-input" />
              </div>
              <div class="form-group">
                <label class="form-label" for="course-end">Fecha de término</label>
                <input type="date" id="course-end" class="form-input" />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="course-notes">Descripción o notas iniciales</label>
              <textarea id="course-notes" class="form-textarea" placeholder="¿Qué temas aborda este programa?"></textarea>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-secondary btn-modal-cancel">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar formación</button>
            </div>
          </form>
        `,
        (form) => {
          const title = form.querySelector("#course-title").value.trim();
          if (!title) return;
          const newCourse = {
            id: "f_" + Date.now(),
            titulo: title,
            tipo: form.querySelector("#course-type").value,
            estado: form.querySelector("#course-status").value,
            institucion: form.querySelector("#course-inst").value.trim(),
            fechaInicio: form.querySelector("#course-start").value,
            fechaFin: form.querySelector("#course-end").value,
            notas: form.querySelector("#course-notes").value.trim(),
            comprobanteNombre: ""
          };
          AppState.formacion.unshift(newCourse);
          saveAllState();
          closeModal();
          showToast("Formación agregada exitosamente.");
          renderApp();
        }
      );
    }

    function openEditCourseModal(id) {
      const item = AppState.formacion.find(c => c.id === id);
      if (!item) return;

      openModal(
        "Editar formación",
        `
          <form id="form-edit-course">
            <div class="form-group">
              <label class="form-label" for="edit-course-title">Título <span class="req">*</span></label>
              <input type="text" id="edit-course-title" class="form-input" value="${sanitizeText(item.titulo)}" required />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="edit-course-type">Tipo</label>
                <select id="edit-course-type" class="form-select">
                  <option value="curso" ${item.tipo === 'curso' ? 'selected' : ''}>Curso</option>
                  <option value="diplomado" ${item.tipo === 'diplomado' ? 'selected' : ''}>Diplomado</option>
                  <option value="certificacion" ${item.tipo === 'certificacion' ? 'selected' : ''}>Certificación</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="edit-course-status">Estado</label>
                <select id="edit-course-status" class="form-select">
                  <option value="en_curso" ${item.estado === 'en_curso' ? 'selected' : ''}>En curso</option>
                  <option value="completado" ${item.estado === 'completado' ? 'selected' : ''}>Completado</option>
                  <option value="pendiente" ${item.estado === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-course-inst">Institución u Organización</label>
              <input type="text" id="edit-course-inst" class="form-input" value="${sanitizeText(item.institucion || '')}" />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="edit-course-start">Fecha de inicio</label>
                <input type="date" id="edit-course-start" class="form-input" value="${item.fechaInicio || ''}" />
              </div>
              <div class="form-group">
                <label class="form-label" for="edit-course-end">Fecha de término</label>
                <input type="date" id="edit-course-end" class="form-input" value="${item.fechaFin || ''}" />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-course-notes">Descripción o notas</label>
              <textarea id="edit-course-notes" class="form-textarea">${sanitizeText(item.notas || '')}</textarea>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-secondary btn-modal-cancel">Cancelar</button>
              <button type="submit" class="btn btn-primary">Actualizar cambios</button>
            </div>
          </form>
        `,
        (form) => {
          const title = form.querySelector("#edit-course-title").value.trim();
          if (!title) return;
          item.titulo = title;
          item.tipo = form.querySelector("#edit-course-type").value;
          item.estado = form.querySelector("#edit-course-status").value;
          item.institucion = form.querySelector("#edit-course-inst").value.trim();
          item.fechaInicio = form.querySelector("#edit-course-start").value;
          item.fechaFin = form.querySelector("#edit-course-end").value;
          item.notas = form.querySelector("#edit-course-notes").value.trim();
          saveAllState();
          closeModal();
          showToast("Formación actualizada.");
          renderApp();
        }
      );
    }

    function confirmDeleteCourse(id) {
      const item = AppState.formacion.find(c => c.id === id);
      if (!item) return;
      openModal(
        "Confirmar eliminación",
        `
          <p style="font-size: 13.5px; color: var(--text-secondary); margin-bottom: 20px;">
            ¿Deseas eliminar el registro <strong>"${sanitizeText(item.titulo)}"</strong>? Esta acción no se puede deshacer.
          </p>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-modal-cancel">Cancelar</button>
            <button type="button" class="btn btn-danger" onclick="deleteCourse('${id}')">Eliminar definitivamente</button>
          </div>
        `
      );
    }

    function deleteCourse(id) {
      AppState.formacion = AppState.formacion.filter(c => c.id !== id);
      saveAllState();
      closeModal();
      showToast("Registro eliminado.");
      renderApp();
    }

    function renderPreparacionView() {
      let tabContent = "";
      if (activePrepTab === "cv") {
        tabContent = renderCvSubTab();
      } else if (activePrepTab === "portafolio") {
        tabContent = renderPortafolioSubTab();
      } else {
        tabContent = renderEntrevistasSubTab();

      return `
        <div>
          <div class="section-kicker" style="color: var(--color-preparacion);">Área 2</div>
          <h1 class="page-title">Preparación Profesional</h1>
          <p class="page-description">
            Estructura tus herramientas de empleabilidad: un currículum honesto basado en competencias, un portafolio de evidencias y entrenamiento para entrevistas con el método STAR.
          </p>

          <!-- Barra de pestañas con iconos semánticos de línea -->
          <div class="tab-bar" role="tablist">
            <button class="tab-btn ${activePrepTab === 'cv' ? 'active' : ''}" role="tab" onclick="switchPrepTab('cv')">
              ${Icons.fileText(18)}
              <span>Currículum Vitae</span>
            </button>
            <button class="tab-btn ${activePrepTab === 'portafolio' ? 'active' : ''}" role="tab" onclick="switchPrepTab('portafolio')">
              ${Icons.folder(18)}
              <span>Portafolio de Proyectos</span>
            </button>
            <button class="tab-btn ${activePrepTab === 'entrevistas' ? 'active' : ''}" role="tab" onclick="switchPrepTab('entrevistas')">
              ${Icons.messageSquare(18)}
              <span>Banco de Entrevistas STAR</span>
            </button>
          </div>

          <!-- Contenido de pestaña -->
          <div>
            ${tabContent}
          </div>
        </div>
      `;
    }

    function switchPrepTab(tab) {
      activePrepTab = tab;
      renderApp();
    }

    function updateCvField(field, val) {
      AppState.cv[field] = val;
      saveAllState();
      const previewName = document.querySelector(".cv-preview-name");
      const previewContact = document.querySelector(".cv-preview-contact");
      if (field === "nombre" && previewName) previewName.textContent = val || "Nombre y Apellidos";
      if (field === "contacto" && previewContact) previewContact.textContent = val || "Contacto";
    }

    function updateCvSkills(str) {
      AppState.cv.habilidades = str.split(",").map(s => s.trim()).filter(Boolean);
      saveAllState();
      renderApp();
    }

    function updateCvIdiomas(str) {
      AppState.cv.idiomas = str.split(",").map(s => s.trim()).filter(Boolean);

      renderApp();

        "Agregar proyecto al portafolio",
        `

              <label class="form-label" for="proj-title">Título del proyecto <span class="req">*</span></label>

              <label class="form-label" for="proj-result">Resultado o aprendizaje clave</label>
              <input type="text" id="proj-result" class="form-input" placeholder="Ej. Aprobado con mención de honor / Reducción de 20% en tiempos" />

              <label class="form-label" for="proj-link">Enlace de evidencia (Opcional, http:// o https://)</label>
              <input type="url" id="proj-link" class="form-input" placeholder="https://..." />

              <button type="button" class="btn btn-secondary btn-modal-cancel">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar proyecto</button>
            </div>
          </form>
        `,
        (form) => {
          const title = form.querySelector("#proj-title").value.trim();
          const desc = form.querySelector("#proj-desc").value.trim();
          const contrib = form.querySelector("#proj-contrib").value.trim();
          const skills = form.querySelector("#proj-skills").value.trim();
          const result = form.querySelector("#proj-result").value.trim();
          const link = form.querySelector("#proj-link").value.trim();

          if (!title || !desc || !contrib) return;
          if (link && !isValidUrl(link)) {
            showToast("Error: El enlace debe comenzar con http:// o https://");
            return;
          }

          const newProj = {
            id: "p_" + Date.now(),
            titulo: title,
            descripcion: desc,
            aportacion: contrib,
            habilidades: skills,
            resultado: result,
            enlace: link
          };

          AppState.portafolio.unshift(newProj);
          saveAllState();
          closeModal();
          showToast("Proyecto agregado al portafolio.");
          renderApp();
        }
      );

            </div>

            <div class="form-group">
              <label class="form-label" for="edit-proj-skills">Habilidades o herramientas</label>

            <div class="modal-footer">
              <button type="button" class="btn btn-secondary btn-modal-cancel">Cancelar</button>
              <button type="submit" class="btn btn-primary">Actualizar proyecto</button>
            </div>
          </form>
        `,
        (form) => {
          const title = form.querySelector("#edit-proj-title").value.trim();
          const desc = form.querySelector("#edit-proj-desc").value.trim();
          const contrib = form.querySelector("#edit-proj-contrib").value.trim();
          const link = form.querySelector("#edit-proj-link").value.trim();

          if (!title || !desc || !contrib) return;
          if (link && !isValidUrl(link)) {

    function confirmDeleteProject(id) {
      const p = AppState.portafolio.find(x => x.id === id);
      if (!p) return;
      openModal(
        "Confirmar eliminación",
        `
          <p style="font-size: 13.5px; color: var(--text-secondary); margin-bottom: 20px;">
            ¿Deseas eliminar el proyecto <strong>"${sanitizeText(p.titulo)}"</strong> de tu portafolio?
          </p>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-modal-cancel">Cancelar</button>
            <button type="button" class="btn btn-danger" onclick="deleteProject('${id}')">Eliminar</button>
          </div>
        `
      );

    function deleteProject(id) {
      AppState.portafolio = AppState.portafolio.filter(x => x.id !== id);
      saveAllState();
      closeModal();
      showToast("Proyecto eliminado.");
      renderApp();
    }

    // Sub-pestaña C: Entrevistas STAR
    function renderEntrevistasSubTab() {
      const state = AppState.entrevistasState;
      const bank = INTERVIEW_BANK[state.idioma][state.nivel];
      const currentQ = bank[state.indicePregunta] || bank[0];

      const storedAnswers = StorageManager.get("interview_answers", {});
      const myAnswer = storedAnswers[currentQ.id] || "";

      return `
        <div>
          <!-- Guía del Método STAR -->
          <div class="star-guide-banner">
            <strong>Guía del Método STAR para entrevistas conductuales</strong>
            <p style="font-size: 12.5px; color: var(--text-secondary); margin-top: 2px;">
              Estructura tus respuestas para ser claro, concreto y honesto sin dispersarte.
            </p>
            <div class="star-steps">
              <div class="star-step-item">
                <strong>S · Situación</strong>
                <span>Contexto breve del reto o proyecto</span>
              </div>
              <div class="star-step-item">
                <strong>T · Tarea</strong>
                <span>Qué objetivo o responsabilidad tenías</span>
              </div>
              <div class="star-step-item">
                <strong>A · Acción</strong>
                <span>Qué hiciste tú concretamente</span>
              </div>
              <div class="star-step-item">
                <strong>R · Resultado</strong>
                <span>Qué impacto o aprendizaje obtuviste</span>
              </div>
            </div>
          </div>

          <!-- Selectores de Idioma y Nivel -->
          <div class="controls-bar" style="margin-bottom: 16px;">
            <div style="display: flex; gap: 8px;">
              <select class="form-select" onchange="changeInterviewLanguage(this.value)">
                <option value="es" ${state.idioma === 'es' ? 'selected' : ''}>Idioma: Español</option>
                <option value="en" ${state.idioma === 'en' ? 'selected' : ''}>Language: English</option>
              </select>

              <select class="form-select" onchange="changeInterviewLevel(this.value)">
                <option value="inicial" ${state.nivel === 'inicial' ? 'selected' : ''}>Nivel Inicial</option>
                <option value="intermedio" ${state.nivel === 'intermedio' ? 'selected' : ''}>Nivel Intermedio</option>
              </select>
            </div>

            <div style="font-size: 13px; color: var(--text-muted);">
              Pregunta ${state.indicePregunta + 1} de ${bank.length}
            </div>
          </div>

          <!-- Tarjeta Interactiva de Pregunta -->
          <div class="interview-card">
            <div style="font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--color-preparacion); letter-spacing: 0.05em; margin-bottom: 6px;">
              Pregunta de entrevista
            </div>
            <h3 style="font-size: 18px; font-weight: 600; color: var(--text-primary); margin-bottom: 10px;">
              "${sanitizeText(currentQ.pregunta)}"
            </h3>

            <div style="font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; display: flex; align-items: flex-start; gap: 6px;">
              <span style="color: var(--color-postulaciones); margin-top: 2px;">${Icons.lightbulb(15)}</span>
              <span><strong>Consejo del evaluador:</strong> ${sanitizeText(currentQ.consejo)}</span>
            </div>

            <!-- Botón para revelar / ocultar sugerencia -->
            <button class="btn btn-secondary btn-sm" onclick="toggleInterviewSuggestion()">
              ${state.revelarSugerencia ? 'Ocultar ejemplo orientativo' : 'Ver ejemplo orientativo STAR'}
            </button>

            ${state.revelarSugerencia ? `
              <div class="interview-suggestion-box">
                <div style="font-size: 11.5px; font-weight: 700; color: var(--color-preparacion); text-transform: uppercase; margin-bottom: 4px;">
                  Ejemplo orientativo (No inventes logros; adapta a tu propia vivencia):
                </div>
                <div style="white-space: pre-line; line-height: 1.5;">${sanitizeText(currentQ.sugerencia)}</div>
              </div>
            ` : ''}

            <!-- Campo de práctica personal autoguardado -->
            <div style="margin-top: 20px;">
              <label class="form-label" for="my-answer-${currentQ.id}">
                Practica y escribe tu propia respuesta STAR para esta pregunta:
              </label>
              <textarea id="my-answer-${currentQ.id}" class="form-textarea" style="min-height: 90px;" placeholder="Describe tu Situación, Tarea, Acción y Resultado..." oninput="handleSaveInterviewAnswer('${currentQ.id}', this.value)">${sanitizeText(myAnswer)}</textarea>
              <div style="font-size: 11.5px; color: var(--text-muted); margin-top: 4px;" id="answer-status-${currentQ.id}">
                ${myAnswer ? 'Tu respuesta está guardada en este navegador' : 'Escribe para guardar tu práctica'}
              </div>
            </div>

            <!-- Navegación entre preguntas -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-subtle);">
              <button class="btn btn-secondary btn-sm" onclick="prevInterviewQuestion()" ${state.indicePregunta === 0 ? 'disabled style="opacity: 0.5;"' : ''}>
                &larr; Pregunta anterior
              </button>
              <button class="btn btn-secondary btn-sm" onclick="nextInterviewQuestion()" ${state.indicePregunta === bank.length - 1 ? 'disabled style="opacity: 0.5;"' : ''}>
                Siguiente pregunta &rarr;
              </button>
            </div>
          </div>

          <div style="font-size: 12px; color: var(--text-muted); margin-top: 14px; text-align: center;">
            Aviso pedagógico: Las respuestas son guías demostrativas. La mejor entrevista siempre es aquella basada en tu experiencia real sin exageraciones.
          </div>
        </div>
      `;
    }

    function changeInterviewLanguage(lang) {
      AppState.entrevistasState.idioma = lang;
      AppState.entrevistasState.indicePregunta = 0;
      AppState.entrevistasState.revelarSugerencia = false;
      renderApp();
    }

    function changeInterviewLevel(level) {
      AppState.entrevistasState.nivel = level;
      AppState.entrevistasState.indicePregunta = 0;
      AppState.entrevistasState.revelarSugerencia = false;
      renderApp();
    }

    function toggleInterviewSuggestion() {
      AppState.entrevistasState.revelarSugerencia = !AppState.entrevistasState.revelarSugerencia;
      renderApp();
    }

    function nextInterviewQuestion() {
      const bank = INTERVIEW_BANK[AppState.entrevistasState.idioma][AppState.entrevistasState.nivel];
      if (AppState.entrevistasState.indicePregunta < bank.length - 1) {
        AppState.entrevistasState.indicePregunta++;
        AppState.entrevistasState.revelarSugerencia = false;
        renderApp();
      }
    }

    function prevInterviewQuestion() {
      if (AppState.entrevistasState.indicePregunta > 0) {
        AppState.entrevistasState.indicePregunta--;
        AppState.entrevistasState.revelarSugerencia = false;
        renderApp();
      }
    }

    let interviewDebounceTimers = {};
    function handleSaveInterviewAnswer(qId, text) {
      const statusElem = document.getElementById(`answer-status-${qId}`);
      if (statusElem) statusElem.textContent = "Guardando...";

      if (interviewDebounceTimers[qId]) clearTimeout(interviewDebounceTimers[qId]);
      interviewDebounceTimers[qId] = setTimeout(() => {
        const stored = StorageManager.get("interview_answers", {});
        stored[qId] = text;
        StorageManager.set("interview_answers", stored);
        if (statusElem) statusElem.textContent = "Respuesta guardada ✓";
      }, 500);
    }

    // --- 11. VISTA: POSTULACIONES ---
    function renderPostulacionesView() {
      const items = AppState.postulaciones;
      const todayStr = getTodayLocalDateString();

      let filtered = items.filter(p => {
        const matchesEstado = AppState.filtros.postulacionesEstado === "todos" || p.estado === AppState.filtros.postulacionesEstado;
        const q = AppState.filtros.postulacionesBusqueda.toLowerCase();
        const matchesQuery = p.empresa.toLowerCase().includes(q) || p.puesto.toLowerCase().includes(q);
        return matchesEstado && matchesQuery;
      });

      filtered.sort((a, b) => {
        const dateA = a.fecha || "";
        const dateB = b.fecha || "";
        return AppState.filtros.postulacionesOrden === "asc" ? dateA.localeCompare(dateB) : dateB.localeCompare(dateA);

      const seguimientosProximos = items.filter(p => p.fechaSeguimiento && p.fechaSeguimiento >= todayStr && p.estado !== "rechazada" && p.estado !== "retirada");

          </div>

          <!-- Notificaciones de seguimiento próximo -->
          ${seguimientosProximos.length > 0 ? `
            <div style="background-color: #fefce8; border: 1px solid #fef08a; border-radius: var(--radius-md); padding: 14px 18px; margin-bottom: 20px; font-size: 13px;">
              <div style="display: flex; align-items: center; gap: 6px; color: #854d0e; font-weight: 600; margin-bottom: 6px;">
                ${Icons.bell(16)}
                <span>Seguimientos próximos pendientes:</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 4px;">
                ${seguimientosProximos.map(sp => `
                  <div>
                    • <strong>${sanitizeText(sp.empresa)}</strong> (${sanitizeText(sp.puesto)}) — Fecha de contacto: <strong>${formatDisplayDate(sp.fechaSeguimiento)}</strong>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- Controles de búsqueda, filtro y orden -->
          <div class="controls-bar">
            <div class="search-box">
              <input type="text" class="form-input" placeholder="Buscar por empresa o puesto..." value="${sanitizeText(AppState.filtros.postulacionesBusqueda)}" oninput="handlePostulacionesSearch(this.value)" />

            <div class="filter-group">
              <select class="form-select" onchange="handlePostulacionesFilter(this.value)">

                <option value="enviada" ${AppState.filtros.postulacionesEstado === 'enviada' ? 'selected' : ''}>Enviada</option>
                <option value="entrevista" ${AppState.filtros.postulacionesEstado === 'entrevista' ? 'selected' : ''}>Entrevista</option>
                <option value="oferta" ${AppState.filtros.postulacionesEstado === 'oferta' ? 'selected' : ''}>Oferta</option>
                <option value="rechazada" ${AppState.filtros.postulacionesEstado === 'rechazada' ? 'selected' : ''}>Rechazada</option>
                <option value="retirada" ${AppState.filtros.postulacionesEstado === 'retirada' ? 'selected' : ''}>Retirada</option>
              </select>

              <select class="form-select" onchange="handlePostulacionesSort(this.value)">
                <option value="desc" ${AppState.filtros.postulacionesOrden === 'desc' ? 'selected' : ''}>Más recientes primero</option>
                <option value="asc" ${AppState.filtros.postulacionesOrden === 'asc' ? 'selected' : ''}>Más antiguas primero</option>
              </select>
            </div>
          </div>

          <!-- Tabla de postulaciones -->
          ${filtered.length === 0 ? `
            <div class="empty-state">
              <div class="empty-state-icon">${Icons.clipboardCheck(32, 'var(--text-muted)')}</div>
              <div class="empty-state-title">No hay postulaciones que coincidan</div>
              <div class="empty-state-desc">
                ${items.length === 0 ? 'Registra tu primera postulación para dar seguimiento a tus candidaturas.' : 'Prueba cambiando los filtros de búsqueda o estado.'}
              </div>
              ${items.length === 0 ? '<button class="btn btn-primary" onclick="openAddPostulacionModal()">Registrar primera postulación</button>' : ''}
            </div>
          ` : `
            <div class="postulaciones-table-container">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Empresa</th>
                    <th>Puesto</th>
                    <th>Fecha postulación</th>
                    <th>Estado</th>
                    <th>Próximo seguimiento</th>
                    <th>Acciones</th>

                <tbody>
                  ${filtered.map(p => `

                      <td data-label="Empresa">
                        <strong>${sanitizeText(p.empresa)}</strong>
                        ${p.enlace && isValidUrl(p.enlace) ? `
                          <a href="${sanitizeText(p.enlace)}" target="_blank" rel="noopener noreferrer" style="display: inline-flex; color: var(--color-inicio); margin-left: 4px;" title="Ver vacante" aria-label="Ver vacante externa de ${sanitizeText(p.empresa)}">
                            ${Icons.externalLink(13)}
                          </a>
                        ` : ''}
                      </td>
                      <td data-label="Puesto">${sanitizeText(p.puesto)}</td>
                      <td data-label="Fecha postulación">${formatDisplayDate(p.fecha)}</td>
                      <td data-label="Estado">

                          <option value="entrevista" ${p.estado === 'entrevista' ? 'selected' : ''}>Entrevista</option>
                          <option value="oferta" ${p.estado === 'oferta' ? 'selected' : ''}>Oferta</option>
                          <option value="rechazada" ${p.estado === 'rechazada' ? 'selected' : ''}>Rechazada</option>
                          <option value="retirada" ${p.estado === 'retirada' ? 'selected' : ''}>Retirada</option>
                        </select>
                      </td>
                      <td data-label="Seguimiento">
                        ${p.fechaSeguimiento ? `
                          <span style="${p.fechaSeguimiento <= todayStr ? 'color: #b91c1c; font-weight: 600;' : ''}">
                            ${formatDisplayDate(p.fechaSeguimiento)}
                          </span>
                        ` : '<span style="color: var(--text-muted);">Sin fecha</span>'}
                      </td>
                      <td data-label="Acciones">
                        <div style="display: flex; gap: 4px;">
                          <button class="btn btn-secondary btn-sm" onclick="openEditPostulacionModal('${p.id}')" title="Editar postulación" aria-label="Editar postulación">
                            ${Icons.edit(14)}
                          </button>
                          <button class="btn btn-secondary btn-sm" onclick="confirmDeletePostulacion('${p.id}')" title="Eliminar postulación" aria-label="Eliminar postulación">
                            ${Icons.trash(14)}
                          </button>
                        </div>
                      </td>
                    </tr>
                    ${p.notas ? `
                      <tr class="notes-row" style="background-color: var(--bg-secondary); font-size: 12px; color: var(--text-secondary);">
                        <td colspan="6" style="padding: 6px 14px;">
                          <span style="font-weight: 600; color: var(--text-primary); margin-right: 4px;">Notas:</span> ${sanitizeText(p.notas)}
                        </td>
                      </tr>
                    ` : ''}
                  `).join('')}
                </tbody>
              </table>
            </div>
          `}
        </div>
      `;
    }

    function handlePostulacionesSearch(val) {
      AppState.filtros.postulacionesBusqueda = val;
      renderApp();
    }

    function handlePostulacionesFilter(val) {
      AppState.filtros.postulacionesEstado = val;
      renderApp();
    }

    function handlePostulacionesSort(val) {
      AppState.filtros.postulacionesOrden = val;
      renderApp();
    }

    function changePostulacionStatus(id, newStatus) {
      const p = AppState.postulaciones.find(x => x.id === id);
      if (p) {
        p.estado = newStatus;
        saveAllState();
        showToast(`Estado actualizado a: ${newStatus}`);
        renderApp();
      }
    }

    function openAddPostulacionModal() {
      openModal(
        "Registrar nueva postulación",
        `
          <form id="form-postulacion">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="pos-empresa">Empresa u Organización <span class="req">*</span></label>

          };

          AppState.postulaciones.unshift(newPos);
          saveAllState();
          closeModal();
          showToast("Postulación registrada.");
          renderApp();

    function confirmDeletePostulacion(id) {
      const p = AppState.postulaciones.find(x => x.id === id);
      if (!p) return;
      openModal(
        "Confirmar eliminación",
        `
          <p style="font-size: 13.5px; color: var(--text-secondary); margin-bottom: 20px;">
            ¿Deseas eliminar la postulación para <strong>"${sanitizeText(p.puesto)}"</strong> en <strong>"${sanitizeText(p.empresa)}"</strong>?

          <div class="modal-footer">

      AppState.postulaciones = AppState.postulaciones.filter(x => x.id !== id);

      renderApp();

    // --- 12. VISTA: JOURNAL Y HÁBITOS ---
    function renderJournalView() {
      const journal = AppState.journal;
      const todayStr = getTodayLocalDateString();
      const habitosHoy = AppState.habitos.registro[todayStr] || [];

                  <span class="prompt-chip" onclick="insertReflectionPrompt('¿Qué aprendí hoy en mi proceso?')">¿Qué aprendí hoy?</span>
                  <span class="prompt-chip" onclick="insertReflectionPrompt('¿Qué obstáculo encontré y cómo lo enfrenté?')">Obstáculo superado</span>
                  <span class="prompt-chip" onclick="insertReflectionPrompt('Un pequeño logro por el que me felicito hoy:')">Pequeño logro</span>
                  <span class="prompt-chip" onclick="insertReflectionPrompt('¿Cómo puedo cuidar mi calma mañana?')">Cuidar mi calma</span>
