            <!-- Columna Derecha: Historial de Entradas Anteriores -->
            <div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="font-size: 16px; font-weight: 600;">Entradas anteriores</h3>
                <span style="font-size: 12.5px; color: var(--text-muted);">${filteredEntries.length} reflexiones</span>
              </div>

              <div style="margin-bottom: 14px;">
                <input type="text" class="form-input" placeholder="Buscar en reflexiones pasadas..." value="${sanitizeText(AppState.filtros.journalBusqueda)}" oninput="handleJournalSearch(this.value)" />
              </div>

              ${filteredEntries.length === 0 ? `
                <div class="empty-state" style="padding: 32px 16px;">
                  <div class="empty-state-icon">${Icons.notebook(32, 'var(--text-muted)')}</div>
                  <div class="empty-state-title">No hay reflexiones registradas</div>
                  <div class="empty-state-desc">Tus entradas guardadas aparecerán aquí ordenadas de más reciente a más antigua.</div>
                </div>
              ` : `
                <div style="display: flex; flex-direction: column; gap: 12px; max-height: 600px; overflow-y: auto; padding-right: 4px;">
                  ${filteredEntries.map(e => `
                    <div class="notion-card" style="padding: 16px;">
                      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px;">
                        <h4 style="font-size: 14.5px; font-weight: 600; color: var(--text-primary);">${sanitizeText(e.titulo || 'Reflexión sin título')}</h4>
                        <div style="display: flex; gap: 4px;">
                          <button class="btn btn-secondary btn-sm" style="padding: 3px 6px;" onclick="openEditJournalModal('${e.id}')" title="Editar reflexión" aria-label="Editar reflexión">
                            ${Icons.edit(13)}
                          </button>
                          <button class="btn btn-secondary btn-sm" style="padding: 3px 6px;" onclick="confirmDeleteJournalEntry('${e.id}')" title="Eliminar reflexión" aria-label="Eliminar reflexión">
                            ${Icons.trash(13)}
                          </button>
                        </div>
                      </div>

                      <div style="font-size: 11.5px; color: var(--text-muted); margin-bottom: 8px;">
                        ${new Date(e.createdAt).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}
                        ${e.updatedAt && e.updatedAt !== e.createdAt ? ' · (Editado)' : ''}
                      </div>

                      <div style="font-size: 13px; color: var(--text-primary); line-height: 1.5; white-space: pre-line;">
                        ${sanitizeText(e.contenido)}
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function insertReflectionPrompt(promptText) {
      const textarea = document.getElementById("journal-content-input");
      if (textarea) {
        const current = textarea.value.trim();
        textarea.value = current ? current + "\n\n" + promptText + "\n" : promptText + "\n";
        updateJournalDraftContent(textarea.value);
        textarea.focus();
      }
    }

    function updateJournalDraftTitle(val) {
      AppState.journal.borrador.titulo = val;
      saveAllState();
    }

    let journalDraftTimer = null;
    function updateJournalDraftContent(val) {
      AppState.journal.borrador.contenido = val;
      const ind = document.getElementById("journal-draft-indicator");
      if (ind) ind.textContent = "Guardando borrador...";
      if (journalDraftTimer) clearTimeout(journalDraftTimer);
      journalDraftTimer = setTimeout(() => {
        saveAllState();
        if (ind) ind.textContent = "Borrador guardado localmente ✓";
      }, 500);
    }

    function clearJournalDraft() {
      AppState.journal.borrador = { titulo: "", contenido: "" };
      saveAllState();
      renderApp();
      showToast("Borrador limpiado.");
    }

    function saveJournalEntry() {
      const draft = AppState.journal.borrador;
      const content = draft.contenido.trim();
      if (!content) {
        showToast("Por favor escribe contenido para guardar la reflexión.");
        return;
      }

      const now = new Date().toISOString();
      const newEntry = {
        id: "j_" + Date.now(),
        titulo: draft.titulo.trim(),
        contenido: content,
        createdAt: now,
        updatedAt: now
      };

      AppState.journal.entradas.unshift(newEntry);
      AppState.journal.borrador = { titulo: "", contenido: "" };
      saveAllState();
      showToast("Entrada guardada en tu journal.");
      renderApp();
    }

    function handleJournalSearch(val) {
      AppState.filtros.journalBusqueda = val;
      renderApp();
    }

    function openEditJournalModal(id) {
      const e = AppState.journal.entradas.find(x => x.id === id);
      if (!e) return;

      openModal(
        "Editar reflexión",
        `
          <form id="form-edit-journal">
            <div class="form-group">
              <label class="form-label" for="edit-journal-title">Título (Opcional)</label>
              <input type="text" id="edit-journal-title" class="form-input" value="${sanitizeText(e.titulo || '')}" />
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-journal-content">Contenido <span class="req">*</span></label>
              <textarea id="edit-journal-content" class="form-textarea" style="min-height: 140px;" required>${sanitizeText(e.contenido)}</textarea>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-secondary btn-modal-cancel">Cancelar</button>
              <button type="submit" class="btn btn-primary">Actualizar reflexión</button>
            </div>
          </form>
        `,
        (form) => {
          const content = form.querySelector("#edit-journal-content").value.trim();
          if (!content) return;
          e.titulo = form.querySelector("#edit-journal-title").value.trim();
          e.contenido = content;
          e.updatedAt = new Date().toISOString();
          saveAllState();
          closeModal();
          showToast("Reflexión actualizada.");
          renderApp();
        }
      );
    }

    function confirmDeleteJournalEntry(id) {
      openModal(
        "Confirmar eliminación",
        `
          <p style="font-size: 13.5px; color: var(--text-secondary); margin-bottom: 20px;">
            ¿Estás seguro/a de eliminar esta entrada de reflexión?
          </p>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-modal-cancel">Cancelar</button>
            <button type="button" class="btn btn-danger" onclick="deleteJournalEntry('${id}')">Eliminar</button>
          </div>
        `
      );
    }

    function deleteJournalEntry(id) {
      AppState.journal.entradas = AppState.journal.entradas.filter(x => x.id !== id);
      saveAllState();
      closeModal();
      showToast("Entrada eliminada.");
      renderApp();
    }

    // Funciones de Hábitos
    function toggleHabitForToday(habitId) {
      const todayStr = getTodayLocalDateString();
      if (!AppState.habitos.registro[todayStr]) {
        AppState.habitos.registro[todayStr] = [];
      }

      const list = AppState.habitos.registro[todayStr];
      const idx = list.indexOf(habitId);
      if (idx >= 0) {
        list.splice(idx, 1);
      } else {
        list.push(habitId);
      }

      saveAllState();
      renderApp();
    }

    function openAddHabitModal() {
      openModal(
        "Agregar nuevo micro-hábito diario",
        `
          <form id="form-add-habit">
            <div class="form-group">
              <label class="form-label" for="new-habit-name">Nombre del hábito <span class="req">*</span></label>
              <input type="text" id="new-habit-name" class="form-input" placeholder="Ej. Leer 10 minutos un artículo técnico" required />
              <div class="form-hint">Elige acciones pequeñas, amables y alcanzables.</div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary btn-modal-cancel">Cancelar</button>
              <button type="submit" class="btn btn-primary">Crear hábito</button>
            </div>
          </form>
        `,
        (form) => {
          const name = form.querySelector("#new-habit-name").value.trim();
          if (!name) return;
          const newH = {
            id: "h_" + Date.now(),
            nombre: name
          };
          AppState.habitos.lista.push(newH);
          saveAllState();
          closeModal();
          showToast("Hábito creado.");
          renderApp();
        }
      );
    }

    function renameHabit(id) {
      const h = AppState.habitos.lista.find(x => x.id === id);
      if (!h) return;

      openModal(
        "Renombrar hábito",
        `
          <form id="form-rename-habit">
            <div class="form-group">
              <label class="form-label" for="rename-habit-input">Nuevo nombre <span class="req">*</span></label>
              <input type="text" id="rename-habit-input" class="form-input" value="${sanitizeText(h.nombre)}" required />
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary btn-modal-cancel">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
          </form>
        `,
        (form) => {
          const val = form.querySelector("#rename-habit-input").value.trim();
          if (!val) return;
          h.nombre = val;
          saveAllState();
          closeModal();
          showToast("Hábito renombrado.");
          renderApp();
        }
      );
    }

    function deleteHabit(id) {
      AppState.habitos.lista = AppState.habitos.lista.filter(x => x.id !== id);
      saveAllState();
      showToast("Hábito eliminado.");
      renderApp();
    }

    // --- 13. RENDERIZADOR MAESTRO DE LA APLICACIÓN ---
    function renderApp() {
      const root = document.getElementById("app-root");
      if (!root) return;

      const route = AppState.activeRoute;

      if (route === "bienvenida") {
        root.innerHTML = renderBienvenida();
      } else if (route === "acceso") {
        root.innerHTML = renderAcceso();
      } else if (route === "dashboard") {
        root.innerHTML = renderWorkspaceShell(renderDashboardView(), "Inicio");
      } else if (route === "formacion") {
        root.innerHTML = renderWorkspaceShell(renderFormacionView(), "Formación");
      } else if (route === "preparacion") {
        root.innerHTML = renderWorkspaceShell(renderPreparacionView(), "Preparación profesional");
      } else if (route === "postulaciones") {
        root.innerHTML = renderWorkspaceShell(renderPostulacionesView(), "Postulaciones");
      } else if (route === "journal") {
        root.innerHTML = renderWorkspaceShell(renderJournalView(), "Journal y Hábitos");
      } else {
        root.innerHTML = renderBienvenida();
      }
    }

    // --- 14. INICIALIZACIÓN GLOBAL ---
    window.addEventListener("DOMContentLoaded", () => {
      loadOrCreateInitialData();
      const initialHash = window.location.hash.replace("#", "");
      if (initialHash && ["bienvenida", "acceso", "dashboard", "formacion", "preparacion", "postulaciones", "journal"].includes(initialHash)) {
        AppState.activeRoute = initialHash;
      } else {
        AppState.activeRoute = "bienvenida";
      }
      renderApp();
    });
  </script>
</body>
</html>
